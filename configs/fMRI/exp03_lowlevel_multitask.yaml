# Experiment 3 — multitask: CLIP head + low-level VAE-PCA head.
_base_: [base.yaml]

experiment:
  name: exp03_fmri_lowlevel_multitask

model:
  use_lowlevel: true
  lowlevel_head:
    output_dim: 512          # must match features.pca_dim

features:
  pca_dim: 512

losses:
  lambda_cosine: 1.0
  lambda_contrastive: 1.0
  lambda_lowlevel: 0.25      # configurable weight of the low-level branch

checkpointing:
  monitor: val_top5
  resume: null
