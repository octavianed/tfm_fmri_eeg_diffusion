# EEG Experiment 4 (raw baseline) — generation with a frozen Stable Diffusion.
#
# Inherits the Exp1 config of the SAME variant, so the dataset block
# (source/preproc_variant/normalize/subject) can never drift from the data the
# decoder was trained on. Inheriting from base_17.yaml instead would silently
# fall back to the official 17ch derivative (17×100) and mismatch the decoder.
#
# The token adapter is NOT retrained: it maps CLIP(image) -> VAE(image) and never
# sees EEG, so the one trained for the official-17ch line is reused as-is. Keeping
# a single frozen adapter across all preprocessing ablations also makes Exp5
# differences attributable to the preprocessing/decoder alone (spec §15).
_base_: [exp01_raw_channels_17_eeg_to_clip.yaml]

experiment:
  name: exp04_raw_channel_17_eeg_generation

model:
  use_lowlevel: true          # decoder from Exp3 (CLIP + low-level heads)

generation:
  mode: adapter               # adapter | lowlevel_img2img | adapter_lowlevel
  decoder_checkpoint: outputs/exp03_raw_channels_17_eeg_lowlevel_multitask/checkpoints/best.pt
  # Reuse the already-trained adapter instead of training a new one.
  train_adapter: false
  adapter_checkpoint: outputs/exp04_17_eeg_generation/checkpoints/adapter_best.pt # da igual 17 o 63 en el adapter porque es de clip (no EEG)
  num_samples: 16
  num_inference_steps: 50
  guidance_scale: 3.0
  prompt_mode: empty
  seed: 123
  split: test
