# Igual exp04_generation_v3, pero con dos nuevas features:
# 1) adapter_timesteps_per_sample: cuántos pasos de difusión usar para cada
#    muestra de entrenamiento (promediando la pérdida sobre N pasos aleatorios).
#    Esto reduce el coste de entrenamiento y mejora la generalización (ver docs/03_...md).
# 2) adapter_eval_enabled: si True, se evalúa el adapter en cada N epochs generando unas pocas imágenes de validación y eligiendo el mejor checkpoint por simil
#    por ahora a false para probar solo la feature 1
_base_: [exp04_generation.yaml]

experiment:
  name: exp04_generation_v4_f1   # -> outputs/exp04_generation_v4_f1/ (carpeta propia,
                                 # checkpoints del adapter separados de los de SD-1.5)
training:
  early_stopping_patience: 10
  
generation:
  mode: adapter                 # adapter | lowlevel_img2img | adapter_lowlevel
  sd_model: stable-diffusion-v1-5/stable-diffusion-v1-5
  # El TokenAdapter de SD-1.5 NO sirve aquí: la U-Net de SD-2.1 tiene
  # cross_attention_dim=1024 (768 en SD-1.5), así que sus capas de salida tienen
  # tamaño distinto. Al usar un experiment.name nuevo, adapter_last.pt/adapter_best.pt
  # se guardan en outputs/exp04_generation_sd21/checkpoints/, una carpeta separada de
  # la de SD-1.5, así que "adapter_resume: auto" (heredado) es seguro: no encontrará
  # nada la primera vez y reanudará SU PROPIO adapter en sesiones posteriores.
  adapter_checkpoint: null
  # El decoder debe ser la variante _sd21 de Exp3: su LowLevelHead se entrenó contra
  # el espacio latente/PCA de SD-2.1. Si en algún momento cambias a mode: adapter
  # (semántica pura, sin rama low-level) podrías usar en su lugar cualquier decoder
  # con cabeza CLIP (p. ej. outputs/exp01_fmri_to_clip/checkpoints/best.pt).
  decoder_checkpoint: outputs/exp03_lowlevel_multitask/checkpoints/best.pt
  adapter_scheduler: cosine        # o "none" para desactivarlo
  adapter_warmup_ratio: 0.05       # 5% de los pasos totales en warm-up
  adapter_batch_size: 20 # vs los 4 del experimento anterior
  #guidance_scale: 5.0
  adapter_lr: 3e-4
  adapter_hidden: 1024
  adapter_timesteps_per_sample: 2 # feature 1
  adapter_eval_enabled: false # feature 2

features:
  # Obligatorio SIEMPRE que cambies generation.sd_model, sea cual sea el "mode":
  # train_token_adapter entrena la pérdida de difusión contra estos latentes
  # (vae_latent_path), así que deben venir del MISMO VAE que la U-Net de generación.
  vae_model: stable-diffusion-v1-5/stable-diffusion-v1-5
