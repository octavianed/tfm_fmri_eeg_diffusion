# EEG Experiment 4 — generation with a frozen Stable Diffusion pipeline.
# Mechanism is identical to the fMRI line: predicted CLIP embedding -> TokenAdapter
# -> SD-1.5 (frozen). Default mode 'adapter' (Option B) needs the trained adapter.
_base_: [base_63.yaml]

experiment:
  name: exp04_63_eeg_generation_legacy

training:
  early_stopping_patience: 15

generation:
  conditioning_architecture: legacy_adapter
  mode: adapter                       # adapter | lowlevel_img2img | adapter_lowlevel
  # Source decoder checkpoint (EEG -> CLIP/low). Defaults resolved by the script
  # to exp03 best, then exp01 best, if left null. Point it at the EEG exp03 run:
  decoder_checkpoint: outputs/exp03_63_eeg_lowlevel_multitask/checkpoints/best.pt
  adapter_checkpoint: null
  # Train the (only) trainable module — the token adapter — before generating.
  train_adapter: true
  adapter_epochs: 25
  adapter_resume: auto
  num_inference_steps: 50
  guidance_scale: 3.0
  prompt_mode: empty
  seed: 123
  split: test

  adapter_batch_size: 8 # vs los 4 que usamos por lo general. Aprovechamos más VRAM
  adapter_lr: 2.0e-4  # ~2x el default, porque el batch es 2x (antes era 1e-4 con batch=4)
  grad_checkpointing: false # +31% de velocidad; con ControlNet vigila la VRAM

  # La pérdida de difusión de un timestep NO predice la calidad de generación
  # (docs/03 §6). Con esto, cada N épocas se generan unas imágenes held-out y
  # adapter_best.pt se elige por similitud CLIP, no por loss. Cuesta unos
  # minutos por evaluación y evita quedarte con un checkpoint que "baja la
  # pérdida" pero genera peor.
  adapter_eval_enabled: true
  adapter_eval_every_n_epochs: 5
  adapter_eval_num_samples: 6
  adapter_eval_steps: 25
  adapter_eval_split: val
  adapter_select_by: auto             # auto -> clip_sim porque la eval está on

  # Retención de snapshots del adapter. OJO al disco: con num_tokens=77 (legacy)
  # cada .pt son ~737 MB (pesos + estados de AdamW), así que 10 snapshots son
  # ~7,4 GB por experimento; con num_tokens=8 (text/controlnet) son ~85 MB.
  adapter_save_every_n_epochs: 5
  adapter_keep_last_n: 2
  adapter_keep_first_n: 2

  # Nº de imágenes evaluadas en Exp5. Es el tamaño muestral de los tests
  # pareados: con 16 apenas hay potencia estadística. El test de subj01 tiene
  # 159 imágenes; 'null' las usa todas.
  num_samples: null
  # Muestras por pasada de la U-Net. Antes NO existía y todas las num_samples
  # entraban de golpe (x2 por CFG), lo que limitaba num_samples por VRAM.
  # 8 va sobrado en 17 GB; súbelo si te sobra memoria, bájalo con ControlNet.
  batch_size: 8
  conditions: [correct, permuted, zero]