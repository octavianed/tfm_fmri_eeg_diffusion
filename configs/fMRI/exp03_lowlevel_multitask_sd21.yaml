# Variante SD 2.1 del Experimento 3 (multitarea: CLIP head + low-level VAE-PCA head).
#
# Necesaria SOLO porque el modo de generación configurado en exp04_generation.yaml
# es adapter_lowlevel/lowlevel_img2img: la LowLevelHead debe predecir vectores PCA
# ajustados sobre el espacio latente del VAE de SD-2.1 (no el de SD-1.5), porque los
# espacios latentes de dos checkpoints de VAE distintos NO son intercambiables aunque
# tengan la misma forma [4,64,64]. Si algún día usas mode: adapter (semántica pura,
# sin rama low-level) no necesitarías este fichero para ese caso concreto.
#
# Hereda todo de exp03_lowlevel_multitask.yaml (pca_dim, lambdas, monitor...) y solo
# cambia el VAE y el nombre de experimento, para no pisar los resultados de SD-1.5
# ya entrenados en outputs/exp03_lowlevel_multitask/.
_base_: [exp03_lowlevel_multitask.yaml]

experiment:
  name: exp03_lowlevel_multitask_sd21   # -> outputs/exp03_lowlevel_multitask_sd21/

features:
  # Debe coincidir EXACTAMENTE con generation.sd_model en exp04_generation_sd21.yaml.
  # Al cambiar esto, data/features/vae/<vae_model>/... y el .pkl de la PCA
  # (data/processed/pca/<subject>_<vae_model>_vae_pca_model.pkl) quedan en rutas
  # separadas de las de SD-1.5 automáticamente: no hay riesgo de sobrescritura.
  vae_model: Manojb/stable-diffusion-2-1-base
  # vae_image_size (512) y vae_scaling_factor no cambian: SD-2.1-base es un modelo de
  # 512x512 y su VAE usa el mismo scaling_factor (0.18215) que SD-1.5 (se detecta solo
  # desde el propio modelo al precomputar, no hace falta fijarlo aquí).

training:
  early_stopping_patience: 25