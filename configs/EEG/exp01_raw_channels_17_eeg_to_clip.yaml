# EEG Experiment 1 on the OWN-preprocessed raw data (variant: channels_17, 17×250).
#
# Template showing how any Exp1–Exp5 config points at a preprocessing variant.
# The equivalent without a dedicated file is a CLI override on the usual config:
#   python scripts/02_train_fmri_to_clip.py --config configs/EEG/exp01_17_eeg_to_clip.yaml \
#     --set dataset.source=raw --set dataset.preproc_variant=channels_17 \
#     --set dataset.normalize=false --set experiment.name=exp01_raw_channels_17_eeg_to_clip
#
# Build the variant first:
#   python scripts/09_preprocess_eeg_raw.py --config configs/EEG/preproc/channels_17.yaml
_base_: [base_17.yaml] # por si acaso aunque no afecta usar el base_63.yaml

experiment:
  name: exp01_raw_channels_17_eeg_to_clip

dataset:
  source: raw                   # raw = own pipeline | preprocessed = official derivatives
  preproc_variant: channels_17
  subject_selection: sub-01     # the only subject with raw data downloaded so far
  normalize: false              # MVNN already whitens; no extra z-score (spec §3.4)
  time_window_ms: null          # the crop already happened during preprocessing
  # The signal is 17 × 250; the encoder reads (C, T) from the datamodule, so
  # model.eeg_encoder.in_channels/in_times are informational only.

model:
  use_lowlevel: false

checkpointing:
  monitor: val_top5
  resume: null
