# EEG Experiment 1 on the OWN-preprocessed raw data (variant: temporal_200_400, 63×50).
#
# Ablation §8.4: narrow ATM-like window [200, 400) ms (50 samples @250 Hz).
# Interpret with care: under ~5 Hz RSVP the next stimulus starts near 200 ms.
#
# Build the variant first:
#   .tfm_fmri_diffusion_3_11/Scripts/python.exe scripts/09_preprocess_eeg_raw.py \
#       --config configs/EEG/preproc/temporal_200_400.yaml
_base_: [base_63.yaml]

experiment:
  name: exp01_raw_temporal_200_400_eeg_to_clip

dataset:
  source: raw                   # raw = own pipeline | preprocessed = official derivatives
  preproc_variant: temporal_200_400
  subject_selection: sub-01
  normalize: false              # MVNN/whitening already applied; no extra z-score (spec §3.4)
  time_window_ms: null          # the crop already happened during preprocessing
  # Signal is 63×50; the encoder reads (C, T) from the datamodule, so
  # model.eeg_encoder.in_channels/in_times are informational only.

model:
  use_lowlevel: false

checkpointing:
  monitor: val_top5
  resume: null
