# EEG Experiment 2 (raw baseline) — retrieval ablation: correct / permuted / zero / noise.
# Evaluation-only: loads the Experiment 1 checkpoint and evaluates the controls.
#
# It inherits from the Exp1 config of the SAME variant (not from base_63.yaml) so the
# dataset block — source/preproc_variant/normalize/subject — can never drift from the
# data the checkpoint was trained on. Inheriting from base_63.yaml would silently fall
# back to the official 63ch derivative (63×100, z-scored) and evaluate the raw-trained
# model on the wrong input.
_base_: [exp01_raw_channels_17_eeg_to_clip.yaml]

experiment:
  name: exp02_raw_channels_17_eeg_retrieval_ablation

evaluation:
  # Which experiment's best.pt to evaluate (resolved to outputs/<name>/checkpoints/best.pt).
  source_experiment: exp01_raw_channels_17_eeg_to_clip
  checkpoint: null            # or an explicit path, overrides source_experiment
  split: test
  conditions: [correct, permuted, zero, noise]
  run_baselines: true         # also compute mean + ridge baselines
