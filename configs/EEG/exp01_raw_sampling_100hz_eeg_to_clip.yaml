# EEG Experiment 1 on the OWN-preprocessed raw data (variant: sampling_100hz, 63×100).
#
# Ablation §8.5: resampled to 100 Hz (antialiased), window still [0, 1000) ms.
#
# Build the variant first:
#   .tfm_fmri_diffusion_3_11/Scripts/python.exe scripts/09_preprocess_eeg_raw.py \
#       --config configs/EEG/preproc/sampling_100hz.yaml
_base_: [base_63.yaml]

experiment:
  name: exp01_raw_sampling_100hz_eeg_to_clip

dataset:
  source: raw                   # raw = own pipeline | preprocessed = official derivatives
  preproc_variant: sampling_100hz
  subject_selection: sub-01
  normalize: false              # MVNN/whitening already applied; no extra z-score (spec §3.4)
  time_window_ms: null          # the crop already happened during preprocessing
  # Signal is 63×100; the encoder reads (C, T) from the datamodule, so
  # model.eeg_encoder.in_channels/in_times are informational only.

model:
  use_lowlevel: false

checkpointing:
  monitor: val_top5
  resume: null
